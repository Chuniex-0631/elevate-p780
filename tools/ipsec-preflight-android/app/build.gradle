plugins {
    id 'com.android.application'
}

android {
    namespace 'top.dcmqht.p780ipsec'
    compileSdk 35
    ndkVersion '26.3.11579264'

    externalNativeBuild {
        cmake {
            path file('src/main/cpp/CMakeLists.txt')
            version '3.22.1'
        }
    }

    defaultConfig {
        applicationId 'top.dcmqht.p780ipsec'
        minSdk 28
        targetSdk 30
        versionCode 3
        versionName '0.3.0'
        ndk {
            abiFilters 'arm64-v8a'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

