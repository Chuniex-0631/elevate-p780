name: P780 candidate layout probe (object-level DWARF)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  layout:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - name: Checkout research repository
        uses: actions/checkout@v4

      - name: Install host dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            git make gcc bc bison flex libssl-dev libelf-dev python3 rsync cpio \
            dwarves gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu
          df -h /home/runner

      - name: Retrieve Android Clang 11.0.2 (r383902b1)
        shell: bash
        run: |
          set -euo pipefail
          timeout 600 git clone --depth 1 --filter=blob:none --sparse \
            --branch android11-qpr2-release \
            https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86 \
            clang-prebuilts
          timeout 600 git -C clang-prebuilts sparse-checkout set clang-r383902b1
          clang-prebuilts/clang-r383902b1/bin/clang --version | head -n 1
          echo "$GITHUB_WORKSPACE/clang-prebuilts/clang-r383902b1/bin" >> "$GITHUB_PATH"

      - name: Toolchain smoke test
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p reports
          { printf 'int f(void){return 0;}\n' > /tmp/t.c
            clang -c /tmp/t.c -o /tmp/t.o && ls -l /tmp/t.o || echo "SMOKE FAILED rc=$?"
            clang --version | head -n 3
            df -h /tmp /home/runner
          } > reports/smoke.txt 2>&1
          cat reports/smoke.txt

      - name: Fetch candidate source (pinned)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p reports
          timeout 900 git clone --depth 1 --single-branch --branch droidian \
            https://github.com/arminask/linux-android-samsung-a52sxq.git linux
          git -C linux rev-parse HEAD | tee reports/source-commit.txt

      - name: Configure with the device config
        shell: bash
        run: |
          set -euo pipefail
          gzip -dc evidence/device/p780-config.gz > linux/.config
          make -C linux ARCH=arm64 CC=clang LD=ld.lld AR=llvm-ar NM=llvm-nm \
            OBJCOPY=llvm-objcopy OBJDUMP=llvm-objdump STRIP=llvm-strip \
            CROSS_COMPILE=aarch64-linux-gnu- olddefconfig > reports/olddefconfig.log 2>&1
          ./linux/scripts/config --file linux/.config --disable MODVERSIONS --disable MODULE_SIG --disable MODULE_SIG_ALL --disable LTO_CLANG --disable LTO_CLANG_THIN --disable CFI_CLANG --disable SHADOW_CALL_STACK
          make -C linux ARCH=arm64 CC=clang LD=ld.lld AR=llvm-ar NM=llvm-nm \
            OBJCOPY=llvm-objcopy OBJDUMP=llvm-objdump STRIP=llvm-strip \
            CROSS_COMPILE=aarch64-linux-gnu- olddefconfig > /dev/null 2>&1
          cp linux/.config reports/effective.config
          make -C linux ARCH=arm64 CC=clang LD=ld.lld AR=llvm-ar NM=llvm-nm \
            OBJCOPY=llvm-objcopy OBJDUMP=llvm-objdump STRIP=llvm-strip \
            CROSS_COMPILE=aarch64-linux-gnu- prepare > reports/prepare.log 2>&1

      - name: Build only the objects that define the structures
        shell: bash
        run: |
          set -euo pipefail
          make -C linux ARCH=arm64 CC=clang LD=ld.lld AR=llvm-ar NM=llvm-nm \
            OBJCOPY=llvm-objcopy OBJDUMP=llvm-objdump STRIP=llvm-strip \
            CROSS_COMPILE=aarch64-linux-gnu- -j"$(nproc)" \
            kernel/fork.o kernel/cred.o kernel/locking/rtmutex.o \
            security/selinux/hooks.o fs/exec.o kernel/sys.o \
            V=1 > reports/build.log 2>&1 || { tail -n 60 reports/build.log; exit 1; }
          file linux/kernel/fork.o linux/kernel/cred.o | tee reports/object-types.txt
          df -h /home/runner

      - name: Dump layouts and disassembly
        shell: bash
        run: |
          set -euo pipefail
          pahole -C task_struct linux/kernel/fork.o > reports/pahole-task_struct.txt 2>&1 || true
          pahole -C cred linux/kernel/cred.o > reports/pahole-cred.txt 2>&1 || true
          pahole -C rt_mutex_waiter linux/kernel/locking/rtmutex.o > reports/pahole-rt_mutex_waiter.txt 2>&1 || true
          pahole -C selinux_state linux/security/selinux/hooks.o > reports/pahole-selinux_state.txt 2>&1 || true
          pahole -C uts_namespace linux/kernel/sys.o > reports/pahole-uts_namespace.txt 2>&1 || true
          llvm-objdump -d --no-show-raw-insn linux/kernel/locking/rtmutex.o > reports/rtmutex.dis.txt 2>&1 || true
          llvm-objdump -d --no-show-raw-insn linux/kernel/fork.o > reports/fork.dis.txt 2>&1 || true
          ls -l reports | tee reports/summary.txt

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p780-layout-objects
          path: reports/*
          retention-days: 14
