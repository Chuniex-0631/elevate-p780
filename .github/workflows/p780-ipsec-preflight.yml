name: P780 IPsec preflight Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/p780-ipsec-preflight.yml
      - tools/ipsec-preflight-android/**

permissions:
  contents: read

jobs:
  assemble:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Install Android SDK Platform 35
        run: sdkmanager --install "platforms;android-35" "build-tools;35.0.0"
      - name: Build debug APK (no device execution)
        run: gradle -p tools/ipsec-preflight-android :app:assembleDebug --no-daemon
      - name: Save unsigned-for-release debug artifact
        uses: actions/upload-artifact@v4
        with:
          name: p780-ipsec-preflight-debug-apk
          path: tools/ipsec-preflight-android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
